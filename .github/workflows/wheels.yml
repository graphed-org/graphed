name: wheels

# Standalone binary wheels for the full plan §A.5 matrix, built by cibuildwheel driving the maturin
# (PyO3/Rust) backend. One driver, one config ([tool.cibuildwheel] in pyproject.toml):
#   Linux   x86_64 + aarch64 — BOTH manylinux (glibc) AND musllinux (musl/Alpine): fully standalone
#   macOS   x86_64 + arm64 (native per-arch runners)
#   Windows x86_64
# Each target ships one abi3 wheel (cp311-abi3, serves CPython 3.11-3.14) plus a dedicated
# free-threaded cp314t wheel (no GIL-disabled stable ABI yet, so maturin builds it version-specific).
# The Rust toolchain is pinned (1.98.1): Linux containers install it via the cibuildwheel before-all;
# macOS/Windows use the pinned host toolchain below. No PyPI upload here — see release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: wheels ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, archs: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, archs: aarch64 }
          # ponytail: macos-15-intel is the last Intel runner (retires Fall 2027 with x86_64 macOS);
          # when it goes, drop this row or switch to cross-compiling x86_64 on the arm64 runner.
          - { name: macos-x86_64, os: macos-15-intel, archs: x86_64 }
          - { name: macos-arm64, os: macos-14, archs: arm64 }
          - { name: windows-x86_64, os: windows-latest, archs: AMD64 }
    steps:
      - uses: actions/checkout@v4
      # Pinned host toolchain for the native macOS/Windows builds. Linux builds in a container that
      # installs its own Rust via the before-all, so the host toolchain there is unused — skip it.
      - if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@1.98.1
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: |
          python -m pip install --upgrade pip maturin
          maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
