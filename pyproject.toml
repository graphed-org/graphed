[build-system]
# >=1.14: builds against PyO3 0.29 on CPython 3.15 (free-threaded cp315t included); 1.9.4 already
# emitted the version-specific cp314t wheel when abi3 is enabled but the interpreter is free-threaded.
# cibuildwheel isolates the build and pulls the newest maturin<2, so CI uses this floor or later.
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "graphed"
version = "0.0.10"
description = "A schedulable, serializable, debuggable HEP task-graph system with an interned Rust IR and equality-saturation optimizer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "graphed-org" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
]
# Base install stays light: the frontend + the Rust core (shipped in the wheel) + executing +
# cloudpickle. cloudpickle (pure-Python, tiny) is a core capability, not an extra: graphed.core's
# Plan serializes genuinely-opaque user callables by value (plan.py `kind="opaque"`), so a bare
# `pip install graphed` must be able to build/resolve such a Plan. Backends and preservation
# frameworks stay opt-in extras; `import graphed.awkward` etc. raise a clear ImportError until the
# matching extra is installed.
dependencies = ["executing>=2.0", "cloudpickle"]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
awkward = ["awkward>=2.6", "numpy>=1.24"]
parquet = ["pyarrow>=15"]
checkpoint = ["fsspec>=2022.11.0"]  # FsspecStore; the local Store needs nothing extra
dashboard = ["perspective-python==4.5.1", "tornado>=6.2", "websocket-client>=1.6"]
preserve = ["awkward>=2.6", "numpy>=1.24", "correctionlib>=2.6", "onnx>=1.15", "onnxruntime>=1.17", "cloudpickle"]
ml = ["torch", "xgboost", "tritonclient[grpc,http]", "tensorflow", "jax"]
all = [
  "numpy>=1.24", "awkward>=2.6", "pyarrow>=15", "cloudpickle",
  "correctionlib>=2.6", "onnx>=1.15", "onnxruntime>=1.17",
  "perspective-python==4.5.1", "tornado>=6.2", "websocket-client>=1.6", "fsspec>=2022.11.0",
]
dev = [
  "pytest", "pytest-cov", "pytest-xdist", "coverage[toml]", "diff_cover", "hypothesis", "mypy", "ruff",
  "numpy>=1.24", "awkward>=2.6", "cloudpickle", "pandas", "vector",
  "correctionlib>=2.6", "onnx>=1.15", "onnxruntime>=1.17",
  "boost-histogram>=1.4", "hist>=2.7", "graphed-histogram>=0.0.3",
  "tornado>=6.2", "websocket-client>=1.6",
  # neither ships a win_arm64 wheel, so the Windows ARM64 CI job installs the dev extra without them
  "pyarrow>=15; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "perspective-python==4.5.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
  # FsspecStore's s3 tests run against a local moto server; moto has no win_arm64 resolution
  # (pyyaml on 3.11), and flask/flask-cors are there only to run moto's server; the s3fs floor
  # keeps pip from settling on a pre-aiobotocore s3fs when boto3 outruns aiobotocore's botocore pin
  "s3fs>=2026.7.0",
  "moto[s3]; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "flask; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "flask-cors; sys_platform != 'win32' or platform_machine != 'ARM64'",
]
docs = ["sphinx", "furo", "myst-nb", "graphviz"]

[project.urls]
Homepage = "https://github.com/graphed-org/graphed"

[tool.maturin]
# Mixed layout: the Rust extension is nested at graphed.core.graphed_core, re-exported by the
# graphed.core package. python-source ships the whole graphed/ package tree (all pure-Python
# subpackages) alongside the compiled module. The PyO3 `#[pymodule] fn graphed_core` leaf name and
# `[lib] name` are unchanged; only this dotted module-name moved.
python-source = "python"
module-name = "graphed.core.graphed_core"
# abi3-py311: one limited-API wheel (cp311-abi3) serves 3.11-3.14 (and up). maturin falls back to a
# version-specific build per interpreter that can't use it — notably free-threaded cp314t, which has
# no GIL-disabled stable ABI yet (abi3t/PEP 803 lands in 3.15), so it ships a dedicated cp314t wheel.
features = ["pyo3/extension-module", "pyo3/abi3-py311"]
# The sdist is built from the git tree, so without this it also carries the development notes,
# which are no use to someone installing from PyPI.
exclude = [
    { path = "CLAUDE.md", format = "sdist" },
    { path = ".graphed/**/*", format = "sdist" },
]

[tool.cibuildwheel]
# One driver (cibuildwheel invoking the maturin PEP 517 backend) builds the whole §A.5 matrix.
# The abi3-py311 wheel (cp311-abi3) is built ONCE and reused: cibuildwheel detects the abi3 wheel and
# skips rebuilding on cp312-cp315, still running the smoke test on each. cp314t and cp315t are
# free-threaded (no GIL-disabled stable ABI used yet) so maturin emits a dedicated version-specific
# wheel for each; cp315t needs PyO3 >= 0.29 and maturin >= 1.14.
# Linux gets manylinux AND musllinux (glibc + musl) for x86_64 and aarch64 — fully standalone wheels.
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp314t-*", "cp315-*", "cp315t-*"]
# 32-bit is dropped everywhere (Rust ships no Cargo for musllinux 32-bit; the project targets 64-bit).
skip = ["*_i686", "*-win32", "*-musllinux_i686"]
# Base install is light (executing + cloudpickle), so the compiled core imports with no extra deps.
test-command = 'python -c "import graphed, graphed.core; print(graphed.__version__, graphed.core.version())"'

[tool.cibuildwheel.linux]
# manylinux/musllinux containers ship no Rust — install a pinned toolchain via rustup (works on both
# glibc and Alpine/musl images; only musllinux 32-bit lacks Cargo, already skipped above).
# ponytail: plain rustup install per the cibuildwheel Rust FAQ; if a musllinux image ever drops
# curl/gcc, add a `*-musllinux*` override that `apk add`s them before this line.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos.environment]
# Rust's minimum macOS target is 10.12; raise CPython's default floor to match on the x86_64 build.
MACOSX_DEPLOYMENT_TARGET = "10.12"

[tool.ruff]
line-length = 99
src = ["python", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PLC0415", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# PEP 257 asks for docstrings on public API; test modules and functions are not API.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
"conftest.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
# Frozen m48 test names capitalize words for emphasis; renaming them would change their test ids.
"tests/frozen/awkward/m48/test_*.py" = ["N802"]
# These import an optional extra (numpy, pyarrow, onnx, the dashboard's servers, a preserve
# framework) where it is used, so a base install imports them without it.
"python/graphed/awkward/payloads.py" = ["PLC0415"]
"python/graphed/checkpoint/codec.py" = ["PLC0415"]
"python/graphed/debug/dashboard/_client.py" = ["PLC0415"]
"python/graphed/debug/dashboard/_server.py" = ["PLC0415"]
"python/graphed/numpy/forms.py" = ["PLC0415"]  # awkward, for an awkward type spec
"python/graphed/numpy/io.py" = ["PLC0415"]
"python/graphed/numpy/shuffle.py" = ["PLC0415"]
"python/graphed/parquet.py" = ["PLC0415"]
"python/graphed/preserve/bundle.py" = ["PLC0415"]  # awkward and numpy, to rebuild and compare
"python/graphed/session.py" = ["PLC0415"]  # awkward, for a default Session no one configured
"python/graphed/write.py" = ["PLC0415"]  # fsspec, for a remote output URL
"python/graphed/preserve/externals/_helpers.py" = ["PLC0415"]
"python/graphed/preserve/externals/correctionlib_external.py" = ["PLC0415"]
"python/graphed/preserve/externals/histogram_external.py" = ["PLC0415"]
"python/graphed/preserve/externals/jax_external.py" = ["PLC0415"]
"python/graphed/preserve/externals/onnx_external.py" = ["PLC0415"]
"python/graphed/preserve/externals/pytorch_external.py" = ["PLC0415"]
"python/graphed/preserve/externals/tensorflow_external.py" = ["PLC0415"]
"python/graphed/preserve/externals/triton_external.py" = ["PLC0415"]
"python/graphed/preserve/externals/xgboost_external.py" = ["PLC0415"]
# These load an installed dependency only on the path that needs it, to keep it out of their
# importers: cloudpickle for an opaque callable, the checkpoint store for a capturing plan,
# graphed.preserve's plugins for a template External's first call.
"python/graphed/aggregate.py" = ["PLC0415"]
"python/graphed/awkward/functions.py" = ["PLC0415"]
"python/graphed/core/plan.py" = ["PLC0415"]
# Workers import graphed.debug; a replay or report alone loads the checkpoint codec, numpy or
# graphed.preserve.
"python/graphed/debug/replaying.py" = ["PLC0415"]
"python/graphed/debug/report.py" = ["PLC0415"]
# Array's methods take Varied operands and delegate to the shuffle verbs, and both modules build on
# Array, so those imports wait until a method runs.
"python/graphed/array.py" = ["PLC0415"]

[tool.mypy]
# 3.12 pin: numpy 2.5.0 (py>=3.12) ships PEP695 stubs that require mypy on 3.12+.
python_version = "3.12"
strict = true
files = ["python", "tests", "scripts", "conftest.py"]
# The test tree has no `__init__.py` (pytest prepend-import isolation depends on that), so bare
# basenames collide across packages — m5/m40 `test_projection.py`, m39/m40 `shuffle_backends.py`.
# `explicit_package_bases` + these roots give every test file a unique dotted name derived from the
# repo root (tests.frozen.awkward.m39.golden_route) while `python/graphed/x.py` still resolves as
# `graphed.x` and the vendored corpus mirror as `graphed_corpus`. The CROSS-dir helper providers that
# `[tool.pytest.ini_options] pythonpath` lists are deliberately NOT roots here: making them roots
# renames those milestones' files to bare top-level modules, which collide across milestones
# (golden_route, m49_analyses, shuffle_backends) and hand preserve/m9's conftest the top-level
# `conftest` name, colliding with the repo-root one. The bare-name imports they serve are covered by
# the bare-name override below instead.
explicit_package_bases = true
mypy_path = ["python", ".", "tests/_corpus"]

[[tool.mypy.overrides]]
module = [
  "awkward.*", "numpy.*", "onnx.*", "onnxruntime.*", "correctionlib.*", "cloudpickle.*",
  "pyarrow.*", "perspective.*", "tornado.*", "websocket.*", "boost_histogram.*", "hist.*",
  "vector.*", "pandas.*", "keras.*", "tensorflow.*", "torch.*", "xgboost.*", "jax.*",
  "tritonclient.*", "graphed_histogram.*", "triton_python_backend_utils", "fsspec.*",
  "playwright.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
  "graphed.awkward._ops", "graphed.awkward.backend", "graphed.awkward.functions",
  "graphed.awkward.shuffle", "graphed.numpy", "graphed.numpy.shuffle",
]
warn_return_any = false

# Helper modules that suites import by bare name: pytest reaches them through
# `[tool.pytest.ini_options] pythonpath`, an explicit `sys.path.insert` inside the importing test,
# or same-dir prepend import, and mypy resolves none of the three. They stay type-checked under
# their dotted tests.* names; only the import site is Any. (`m60x_lib`/`m60x_libx` are stand-in
# wrapping libraries beside their own test in tests/extra/frontend/m60.)
[[tool.mypy.overrides]]
module = [
  "agc", "analyses", "backends", "deployment", "fake_triton", "fake_triton_multi",
  "fake_triton_services", "golden_route", "key_order_helpers", "m10_toy", "m11_toy", "m12_toy",
  "m13_helpers",
  "m13_toy", "m14_toy", "m15_toy", "m16_helpers", "m17_toy", "m49_analyses", "m49_ctx_fixtures",
  "m49_vary_fixtures", "m51_write_fixtures", "m52_corpus_fixtures", "m52_point_fixtures",
  "m52_projection_fixtures", "m53_fanout_fixtures", "m53_policy_fixtures",
  "m53b_offgrid_fixtures", "m54_behavior_fixtures", "m55_lockstep_fixtures",
  "m56_fanout_fixtures", "m57_dedupe_fixtures", "m58_declaration_fixtures", "m59_idiom_fixtures",
  "m60_lib", "m60_lib.*", "m60_libx", "m60_parquet_fixtures", "m60_seams", "m60x_lib",
  "m60x_libx", "m62_url_helpers", "m65a1_control_helpers", "m65b_dash_helpers",
  "m68_services_fixtures", "m68c_services_harness", "m69b_opt_fixtures", "m71_check_fixtures",
  "m71_triton_fixtures", "m71a_awkward_fixtures", "m71a_numpy_fixtures", "m71b_fixtures",
  "m71c_fixtures", "m72_awkward_fixtures", "m72_multiout_fixtures", "m74_helpers",
  "shuffle_analyses", "shuffle_backends", "test_fsspec_store", "test_remote_crossprocess",
  "test_remote_resume", "test_store_determinism", "test_url_store_seam", "test_vary_stacking",
  "toy", "vary_ctx_fixtures", "vary_fixtures",
]
ignore_missing_imports = true

# Frozen-suite diagnostics that only a runtime change could clear; the frozen bodies stay as frozen.
# `lambda x: seen.append(x) or y` callbacks, and asserting a None-returning call `is None`.
[[tool.mypy.overrides]]
module = [
  "tests.frozen.checkpoint.m74.test_m74_refusals", "tests.frozen.core.m32.test_sequential_runner",
  "tests.frozen.core.m33.test_bounded_resources", "tests.frozen.frontend.m5.test_projection_support",
  "tests.frozen.preserve.m36.test_content_hash_memo",
]
disable_error_code = ["func-returns-value"]

# Subclasses of untyped bases (awkward, torch via importorskip, the bare-name fake Triton module).
[[tool.mypy.overrides]]
module = [
  "tests.frozen.awkward.m58.m58_declaration_fixtures", "tests.frozen.awkward.m59.m59_idiom_fixtures",
  "tests.frozen.awkward.m60.m60_parquet_fixtures", "tests.frozen.awkward.m71a.m71a_awkward_fixtures",
  "tests.frozen.preserve.m27.test_variadic_frameworks",
  "tests.frozen.preserve.m68.test_triton_transport_by_scheme",
  "tests.frozen.preserve.m71b.m71b_fixtures",
]
disallow_subclassing_any = false

# `from conftest import ...` means this directory's conftest under pytest, but mypy resolves the
# bare name to the repo-root conftest.py.
[[tool.mypy.overrides]]
module = [
  "tests.frozen.corpus.m05.test_catalog", "tests.frozen.corpus.m05.test_determinism",
  "tests.frozen.corpus.m05.test_fixtures_reproduce",
]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Per-subtree runs (see scripts/run-tests.sh) keep each package's frozen suite in its own process
# (prepend import mode + isolation, so duplicate test basenames and the sys.modules purity guard
# behave as in the origin repos). frontend/numpy/awkward run at FINER (per-milestone) granularity
# because M40 added duplicate top-level basenames within them (m39/m40 shuffle_backends.py; m5/m40
# test_projection.py). Same-dir helper imports resolve via prepend automatically; the pythonpath lists
# ONLY the vendored corpus package + the CROSS-dir helper providers (a test dir importing a helper from
# a different dir). `analyses` is listed from checkpoint/m8 alone — awkward/m3 and debug/m6 also ship an
# `analyses.py`, but those are same-dir imports (prepend covers them), so keeping them off the path
# avoids the top-level-name collision.
pythonpath = [
  "python",
  "tests/_corpus",
  "tests/frozen/awkward/m55",
  "tests/frozen/frontend/m2",
  "tests/frozen/frontend/m10",
  "tests/frozen/frontend/m13",
  "tests/frozen/frontend/m15",
  # frontend/m69b's and m72's fixtures serve tests/extra/frontend/<same milestone> (cross-dir).
  "tests/frozen/frontend/m69b",
  "tests/frozen/frontend/m72",
  "tests/frozen/awkward/m16",
  # awkward/m40 imports golden_route from awkward/m39 (cross-dir); needed once awkward runs per-mXX.
  # numpy/m39 ships golden_route.py too, but resolves same-dir via prepend — only m39 here is on path.
  "tests/frozen/awkward/m39",
  # awkward/m57's, m58's and m59's fixtures serve tests/extra/awkward/<same milestone> (cross-dir).
  "tests/frozen/awkward/m57",
  "tests/frozen/awkward/m58",
  "tests/frozen/awkward/m59",
  # awkward/m48's §4.1 anchor reads agc.correctionlib_json() out of preserve/m9 (cross-dir). This
  # also exposes preserve/m9's `conftest` as an importable top-level module name. Three corpus/m05
  # tests DO `from conftest import ...`; they stay correct because run-tests.sh runs corpus and
  # preserve in separate processes and prepend mode seats the test's own dir first, so the same-dir
  # conftest wins. pytest's own conftest collection is unaffected either way.
  "tests/frozen/preserve/m9",
  "tests/frozen/checkpoint/m8",
]

[tool.coverage.run]
branch = true
source = ["graphed"]

[tool.coverage.report]
show_missing = true
fail_under = 90
