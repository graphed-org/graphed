name: release

# Publish to PyPI on a version tag (vX.Y.Z). Wheels are built by cibuildwheel driving maturin — the
# same standalone §A.5 matrix as wheels.yml (Linux manylinux+musllinux x86_64/aarch64, macOS x86_64+
# arm64, Windows x86_64+arm64; one abi3 wheel per target + dedicated free-threaded cp314t/cp315t wheels).
#
# Auth:  PyPI Trusted Publishing (OIDC): publisher owner=graphed-org, repo=graphed,
#        workflow=release.yml, environment=pypi; no API token is stored.
# Verify: the upload carries PyPI's PEP 740 attestations (Sigstore-signed), and every wheel + the
#         sdist also gets a GitHub build-provenance attestation, verifiable with:
#             gh attestation verify <file> --repo graphed-org/graphed
#
# NOTE: bump the version (Cargo.toml + pyproject) before tagging — re-uploading a version that is
# already on PyPI is rejected.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, archs: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, archs: aarch64 }
          - { name: macos-x86_64, os: macos-15-intel, archs: x86_64 }
          - { name: macos-arm64, os: macos-15, archs: arm64 }
          - { name: windows-x86_64, os: windows-latest, archs: AMD64 }
          - { name: windows-arm64, os: windows-11-arm, archs: ARM64 }
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@1.98.1
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: |
          python -m pip install --upgrade pip maturin
          maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI (Trusted Publishing + attestations)
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC: authenticate to PyPI and sign the attestations
      attestations: write # persist the provenance attestations to this repo
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # OIDC-signed provenance for every artifact about to be uploaded; verify with:
      #   gh attestation verify <file> --repo graphed-org/graphed
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true # PEP 740 provenance on PyPI (Trusted Publishing only)
